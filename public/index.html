<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LD Gráfica - Sistema de Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Tela de Login -->
        <div id="login-screen">
            <div class="login-container">
                <div class="logo">
                    <h1>LD Gráfica</h1>
                    <p class="subtitle">Sistema de Atendimento</p>
                </div>
                
                <div class="tabs">
                    <button class="tab active" data-tab="client">Cliente</button>
                    <button class="tab" data-tab="employee">Funcionário</button>
                </div>

                <!-- Login Cliente -->
                <div id="login-client" class="login-form active">
                    <h2>Entrar como Cliente</h2>
                    <input type="text" id="client-name" placeholder="Seu nome" class="input-field">
                    <button id="client-login-btn" class="btn-primary">Entrar</button>
                </div>

                <!-- Login Funcionário -->
                <div id="login-employee" class="login-form">
                    <h2>Área do Funcionário</h2>
                    <input type="text" id="employee-username" placeholder="Usuário" class="input-field">
                    <input type="password" id="employee-password" placeholder="Senha" class="input-field">
                    <button id="employee-login-btn" class="btn-primary">Entrar</button>
                    <div id="employee-error" class="error-message"></div>
                </div>
            </div>
        </div>

        <!-- Tela do Cliente -->
        <div id="client-screen" style="display: none;">
            <div class="client-container">
                <div class="client-header">
                    <h2>LD Gráfica</h2>
                    <button id="client-logout" class="btn-logout">Sair</button>
                </div>
                
                <div class="client-content">
                    <div class="status-panel">
                        <h3>Status do Pedido</h3>
                        <div class="status-display">
                            <span id="current-status">Aguardando</span>
                        </div>
                        <div id="timer-display" style="display: none;">
                            <span id="timer-count">45:00</span>
                        </div>
                    </div>

                    <div class="chat-container">
                        <div id="chat-messages" class="chat-messages"></div>
                        <div class="chat-input">
                            <input type="text" id="chat-input" placeholder="Digite sua mensagem...">
                            <button id="send-btn">Enviar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tela do Funcionário -->
        <div id="employee-screen" style="display: none;">
            <div class="employee-container">
                <div class="employee-header">
                    <h2>Painel do Funcionário</h2>
                    <button id="employee-logout" class="btn-logout">Sair</button>
                </div>
                
                <div class="employee-content">
                    <div class="client-list">
                        <h3>Clientes</h3>
                        <div id="client-list-container"></div>
                    </div>
                    
                    <div class="employee-chat">
                        <div class="chat-header">
                            <h3 id="selected-client-name">Selecione um cliente</h3>
                        </div>
                        
                        <div id="employee-chat-messages" class="chat-messages"></div>
                        
                        <div class="employee-actions" id="employee-actions" style="display: none;">
                            <button class="action-btn" data-action="confirm-order">✅ Confirmar Pedido</button>
                            <button class="action-btn" data-action="confirm-payment">💰 Confirmar Pagamento</button>
                            <div class="production-time-group">
                                <input type="number" id="production-minutes" placeholder="Minutos" class="input-field" min="1" value="45">
                                <button class="action-btn" data-action="set-production">⏱️ Iniciar Produção</button>
                            </div>
                            <button class="action-btn" data-action="finish-production">✅ Finalizar Produção</button>
                        </div>

                        <div class="chat-input">
                            <input type="text" id="employee-chat-input" placeholder="Digite sua mensagem..." disabled>
                            <button id="employee-send-btn" disabled>Enviar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
